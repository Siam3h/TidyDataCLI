name: Generate README

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: 🛠️ Run ./docs/generate_readme.py
        run: python docs/generate_readme.py

      - name: 🚀 Commit and push changes
        run: |
          git config --global siam3h "github-actions[bot]"
          git config --global philosiama@gmail.com "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🤖 Auto-update README from docs" || echo "No changes to commit"
          git push
